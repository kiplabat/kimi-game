# Builds Nyota City as a desktop app and publishes it as a release of this repository:
#   Windows: nyota-city-<v>-windows-x64-setup.exe (installer) and a .zip (portable)
#   Linux:   nyota-city-<v>-linux-x64.AppImage and .tar.gz (+ install-linux.sh for KimiOS/Silverblue)
# Run it from Actions → "Nyota City desktop" → Run workflow, or push a tag nyota-city-v<version>.
name: Nyota City desktop

on:
  workflow_dispatch:
  push:
    tags: ["nyota-city-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the engine and the game
        run: |
          npm ci
          npm run build
          npm test

      - name: Package the desktop app
        working-directory: games/nyota-city/desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: nyota-city-${{ runner.os }}
          if-no-files-found: error
          path: |
            games/nyota-city/desktop/dist/*.AppImage
            games/nyota-city/desktop/dist/*.tar.gz
            games/nyota-city/desktop/dist/*.exe
            games/nyota-city/desktop/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./games/nyota-city/desktop/package.json').version")
          TAG="nyota-city-v$V"
          cp games/nyota-city/desktop/install-linux.sh out/
          ls -la out
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Nyota City $V" --latest=false \
            --notes "Nyota City $V, made with kimi/game on three.js. Runs offline.

          Windows: run nyota-city-$V-windows-x64-setup.exe (or unzip the .zip and run Nyota City.exe).
          Linux: make the .AppImage executable and run it; on KimiOS, Fedora Silverblue or anywhere without FUSE, download the .tar.gz and install-linux.sh and run: sh install-linux.sh nyota-city-$V-linux-x64.tar.gz"
          gh release upload "$TAG" out/* --clobber
